# Team LLM router (router.onara.eu). Seeded once by scripts/deploy-local.sh; your edits are kept.
# Key: ONARA_ROUTER_KEY, read by omp from the process env or ~/.omp/agent/.env (works for
# GUI-launched hosts such as IntelliJ ACP too, since omp loads that file itself).
# cc/* -> Anthropic Messages (/v1/messages), cx/* -> OpenAI Responses (/v1/responses).
# onara-bifrost/* -> Anthropic Messages on the same router with plain API-key shaping (auth: apiKey):
# no Claude Code system prompt or tool prefixes for non-Claude models.
# onara has no `auth:` key on purpose: custom anthropic-messages models then get omp's native
# Claude Code request shaping.
# cost = Anthropic/OpenAI list price, only so `omp stats` can compare runs ($/task).
providers:
  onara:
    baseUrl: https://router.onara.eu/v1
    apiKey: ONARA_ROUTER_KEY
    models:
      - id: cc/claude-opus-5-5
        name: Opus 5.5 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        tokenizer: claude-v5
        thinking: { mode: anthropic-adaptive, efforts: [low, medium, high, xhigh, max], supportsDisplay: true }
        cost: { input: 4, output: 20, cacheRead: 0.2, cacheWrite: 5 }
      - id: cc/claude-opus-5
        name: Opus 5 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        tokenizer: claude-v5
        thinking: { mode: anthropic-adaptive, efforts: [low, medium, high, xhigh, max], supportsDisplay: true }
        cost: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }
      - id: cc/claude-sonnet-5-5
        name: Sonnet 5.5 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        tokenizer: claude-v5-sonnet
        thinking: { mode: anthropic-adaptive, efforts: [low, medium, high, xhigh, max], supportsDisplay: true }
        cost: { input: 2, output: 10, cacheRead: 0.1, cacheWrite: 2.5 }
      - id: cc/claude-sonnet-5
        name: Sonnet 5 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        tokenizer: claude-v5-sonnet
        thinking: { mode: anthropic-adaptive, efforts: [low, medium, high, xhigh, max], supportsDisplay: true }
        cost: { input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5 }
      - id: cc/claude-haiku-5-5
        name: Haiku 5.5 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        contextWindow: 200000
        maxTokens: 64000
        tokenizer: claude-v3
        thinking: { mode: budget, efforts: [minimal, low, medium, high, xhigh] }
        cost: { input: 1, output: 5, cacheRead: 0.1, cacheWrite: 1.25 }
      - id: cx/gpt-5.6-sol
        name: GPT-5.6 Sol (onara)
        api: openai-responses
        reasoning: true
        input: [text, image]
        contextWindow: 372000
        maxTokens: 128000
        tokenizer: o200k
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max] }
        cost: { input: 4, output: 20, cacheRead: 0.4, cacheWrite: 5 }
      - id: cx/gpt-5.6-terra
        name: GPT-5.6 Terra (onara)
        api: openai-responses
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 128000
        tokenizer: o200k
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max] }
        cost: { input: 2, output: 12, cacheRead: 0.2, cacheWrite: 2.5 }
      - id: cx/gpt-5.6-luna
        name: GPT-5.6 Luna (onara)
        api: openai-responses
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 128000
        tokenizer: o200k
        thinking: { mode: effort, efforts: [low, medium, high, xhigh, max] }
        cost: { input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite: 0.25 }
  onara-bifrost:
    baseUrl: https://router.onara.eu/v1
    apiKey: ONARA_ROUTER_KEY
    auth: apiKey
    models:
      - id: bifrost/glm-5.3
        name: GLM-5.3 (onara)
        api: anthropic-messages
        reasoning: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 128000
        tokenizer: glm5
        # Bifrost verified: thinking.type "disabled" returns no thinking block, so :off sends it
        # instead of clamping to the lowest budget.
        thinking: { mode: budget, efforts: [minimal, low, medium, high, xhigh], requiresEffort: false }
        cost: { input: 1.4, output: 4.4, cacheRead: 0.26, cacheWrite: 0 }

setupVersion: 2
modelRoles:
  default: onara/cc/claude-opus-5-5:high
  slow: onara/cc/claude-opus-5-5:xhigh
  plan: onara/cc/claude-opus-5-5:xhigh
  task: onara/cc/claude-sonnet-5-5:medium
  smol: onara/cx/gpt-5.6-luna:low
  tiny: onara/cc/claude-haiku-5-5
  commit: onara/cc/claude-haiku-5-5
  judge: onara/cc/claude-haiku-5-5
  advisor: onara/cx/gpt-5.6-terra:medium
  oracle: onara/cx/gpt-5.6-sol:xhigh
  review: onara/cx/gpt-5.6-terra:high
  deep: onara/cc/claude-opus-5-5:high
cycleOrder:
  - task
  - default
  - slow
retry:
  fallbackOn: any
  fallbackChains:
    onara/cc/claude-opus-5-5:
      - onara/cc/claude-opus-5
      - onara/cx/gpt-5.6-sol
    onara/cc/claude-sonnet-5-5:
      - onara/cc/claude-sonnet-5
      - onara/cx/gpt-5.6-terra
    onara/cx/gpt-5.6-sol:
      - onara/cc/claude-opus-5
    onara/cx/gpt-5.6-terra:
      - onara/cc/claude-sonnet-5-5
    onara/cx/gpt-5.6-luna:
      - onara/cc/claude-haiku-5-5
modelProviderOrder:
  - onara
enabledModels:
  - onara/**
  - onara-bifrost/**
skills:
  enableClaudeProject: false
  ignoredSkills:
    - hyperplan
    - security-research
    - github-triage
    - pre-publish-review
    - remove-deadcode
    - tech-debt-audit
    - work-with-pr
    - work-with-pr-workspace
    - omomomo
task:
  isolation:
    enabled: true
  maxConcurrency: 6
  maxRecursionDepth: 2
  enableLsp: true
  softRequestBudget: 150
  showResolvedModelBadge: true
  agentModelOverrides:
    reviewer: "@review"
autolearn:
  enabled: true
memory:
  backend: local
memories:
  maxRolloutsPerStartup: 0
tools:
  approvalMode: yolo
bash:
  patterns:
    - match: git push --force*
      approval: deny
    - match: git push * --force*
      approval: deny
    - match: git push -f*
      approval: deny
    - match: git push * -f
      approval: deny
    - match: git push * -f *
      approval: deny
    - match: git reset --hard*
      approval: prompt
    - match: git clean -*f*
      approval: prompt
    - match: git branch -D *
      approval: prompt
    - match: rm -rf *
      approval: prompt
    - match: rm -fr *
      approval: prompt
    - match: sh
      approval: deny
    - match: sh -s*
      approval: deny
    - match: bash
      approval: deny
    - match: bash -s*
      approval: deny
    - match: zsh
      approval: deny
lsp:
  diagnosticsOnEdit: true
compaction:
  handoffSaveToDisk: true
  thresholdPercent: 80
  # Token saving: every request resends the whole context, so a session that
  # grows to 800k on a 1M-window model pays for 800k input tokens per turn.
  # A token base per provider makes the 80% policy scale min(window, 375k):
  # every model compacts at min(80% of its window, 300k).
  modelThresholds:
    "onara/*": 375000
    "onara-bifrost/*": 375000
extensionHandlers:
  toolCallTimeoutMs: 420000
plan:
  autosave: true
  autosaveDir: .omo/plans
  review:
    enabled: true
steeringMode: one-at-a-time
contextFiles:
  extra:
    - AGENTS.local.md
